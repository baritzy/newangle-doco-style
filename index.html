<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>בחירת סגנון</title>
<style>
:root{
  --paper:#F2F4F1; --surface:#FFFFFF; --surface-2:#F6F8F4;
  --ink:#141A18; --ink-2:#4B554F; --ink-3:#7C867F;
  --line:#DDE1DB; --line-2:#EAEDE8;
  --accent:#1D5C58; --accent-soft:rgba(29,92,88,.06);
  --shadow:0 1px 2px rgba(20,26,24,.05), 0 1px 10px rgba(20,26,24,.04);
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew","Arial Hebrew",Arial,sans-serif;
  --display:"New Peninim MT","Narkisim","Frank Ruehl CLM","Noto Serif Hebrew","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#101413; --surface:#181E1B; --surface-2:#1C2320;
    --ink:#E9ECE7; --ink-2:#A9B3AC; --ink-3:#87918A;
    --line:#2A322D; --line-2:#232A26;
    --accent:#5CBDB5; --accent-soft:rgba(92,189,181,.09);
    --shadow:0 1px 2px rgba(0,0,0,.32);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 40px}

/* ---------- head ---------- */
header{padding:56px 0 30px}
h1{font-family:var(--display);font-size:clamp(26px,4.4vw,38px);line-height:1.15;font-weight:600;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:15px;margin:10px 0 0;max-width:56ch}
.hint{color:var(--ink-3);font-size:13px;margin:6px 0 0}

/* ---------- option block ---------- */
.opt{
  border-top:1px solid var(--line);
  padding:38px 0 40px;
  margin:0 -20px; padding-inline:20px;
  transition:background .18s ease;
}
.opt.on{background:var(--accent-soft)}
.opt-head{display:flex;align-items:center;gap:10px;margin:0 0 18px}
.opt h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0;letter-spacing:.01em}
.mark{
  font-size:12px;line-height:1;color:var(--accent);border:1px solid var(--accent);
  border-radius:99px;padding:5px 10px;opacity:0;transform:translateY(-1px);
  transition:opacity .18s ease;
}
.opt.on .mark{opacity:1}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
figure{margin:0;min-width:0}
.shot{
  display:block;width:100%;padding:0;border:0;background:transparent;
  font:inherit;color:inherit;cursor:zoom-in;text-align:start;
}
.frame{
  display:block;width:100%;aspect-ratio:16/9;overflow:hidden;
  background:var(--surface-2);
  border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);
  transition:border-color .18s ease;
}
.frame img{display:block;width:100%;height:100%;object-fit:cover;border:0}
.frame img.gone{display:none}
.shot:hover .frame,.shot:focus-visible .frame{border-color:var(--ink-3)}
.shot:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
figcaption{font-size:12px;color:var(--ink-3);margin:9px 2px 0;letter-spacing:.02em}
.opt.on .frame{border-color:var(--accent)}

/* ---------- choose ---------- */
.choose{margin:22px 0 0}
.pick{
  font:inherit;font-size:15px;font-weight:600;line-height:1;
  padding:15px 26px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  transition:background .16s ease,color .16s ease,border-color .16s ease;
}
.pick:hover{border-color:var(--ink-3);color:var(--ink)}
.pick:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.opt.on .pick{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){ .opt.on .pick{color:#0C1210} }
.pick .on-t{display:none}
.opt.on .pick .off-t{display:none}
.opt.on .pick .on-t{display:inline}

/* ---------- footer ---------- */
.foot{border-top:1px solid var(--line);padding:34px 0 0}
label.nl{display:block;font-size:13.5px;color:var(--ink-2);margin:0 0 8px}
textarea{
  width:100%;max-width:70ch;font:inherit;font-size:14.5px;line-height:1.5;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  resize:vertical;min-height:96px;
}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.status{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:12.5px;color:var(--ink-3)}
.status .dot{width:6px;height:6px;border-radius:99px;background:var(--accent);flex:none;opacity:.55}
.close-note{font-size:13.5px;color:var(--ink-2);margin:20px 0 0;max-width:60ch}

/* ---------- lightbox ---------- */
.lb{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;padding:68px 24px 52px;
  background:rgba(10,14,13,.94);cursor:zoom-out;
}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
.lb .lb-cap{position:absolute;bottom:18px;inset-inline:0;text-align:center;font-size:12.5px;color:rgba(255,255,255,.6)}
.lb-x{
  position:absolute;top:16px;inset-inline-end:18px;
  font:inherit;font-size:21px;line-height:1;width:40px;height:40px;
  border:0;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;
}
.lb-x:hover{background:rgba(255,255,255,.22)}
.lb-x:focus-visible{outline:2px solid rgba(255,255,255,.75);outline-offset:2px}
body.locked{overflow:hidden}

@media (max-width:760px){
  .opt{margin:0 -16px;padding-inline:16px}
  .lb{padding:60px 12px 46px}
  header{padding:38px 0 22px}
  .wrap{padding:0 16px 32px}
  .pair{grid-template-columns:1fr;gap:20px}
  .opt{padding:30px 0 32px}
  .pick{width:100%;padding:16px 20px}
}
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>בחירת סגנון האנימציה</h1>
    <p class="sub">שלוש אופציות. אותה סצנה בדיוק בכל אחת, כדי שההשוואה תהיה נקייה. כל אופציה מוצגת בשחור-לבן ובצבע.</p>
    <p class="hint">לחיצה על תמונה פותחת אותה בגדול.</p>
  </header>

  <main id="opts">

    <section class="opt" data-opt="1">
      <div class="opt-head">
        <h2>אופציה 1</h2>
        <span class="mark">נבחרה</span>
      </div>
      <div class="pair">
        <figure>
          <button class="shot" type="button" data-src="img/opt1-bw.jpg" data-cap="אופציה 1, שחור-לבן" aria-label="הגדלה: אופציה 1, שחור-לבן">
            <span class="frame"><img src="img/opt1-bw.jpg" alt="" decoding="async"></span>
          </button>
          <figcaption>שחור-לבן</figcaption>
        </figure>
        <figure>
          <button class="shot" type="button" data-src="img/opt1-color.jpg" data-cap="אופציה 1, צבע" aria-label="הגדלה: אופציה 1, צבע">
            <span class="frame"><img src="img/opt1-color.jpg" alt="" decoding="async"></span>
          </button>
          <figcaption>צבע</figcaption>
        </figure>
      </div>
      <div class="choose">
        <button class="pick" type="button" aria-pressed="false">
          <span class="off-t">בוחר באופציה הזו</span><span class="on-t" hidden>האופציה שנבחרה</span>
        </button>
      </div>
    </section>

    <section class="opt" data-opt="2">
      <div class="opt-head">
        <h2>אופציה 2</h2>
        <span class="mark">נבחרה</span>
      </div>
      <div class="pair">
        <figure>
          <button class="shot" type="button" data-src="img/opt2-bw.jpg" data-cap="אופציה 2, שחור-לבן" aria-label="הגדלה: אופציה 2, שחור-לבן">
            <span class="frame"><img src="img/opt2-bw.jpg" alt="" decoding="async"></span>
          </button>
          <figcaption>שחור-לבן</figcaption>
        </figure>
        <figure>
          <button class="shot" type="button" data-src="img/opt2-color.jpg" data-cap="אופציה 2, צבע" aria-label="הגדלה: אופציה 2, צבע">
            <span class="frame"><img src="img/opt2-color.jpg" alt="" decoding="async"></span>
          </button>
          <figcaption>צבע</figcaption>
        </figure>
      </div>
      <div class="choose">
        <button class="pick" type="button" aria-pressed="false">
          <span class="off-t">בוחר באופציה הזו</span><span class="on-t" hidden>האופציה שנבחרה</span>
        </button>
      </div>
    </section>

    <section class="opt" data-opt="3">
      <div class="opt-head">
        <h2>אופציה 3</h2>
        <span class="mark">נבחרה</span>
      </div>
      <div class="pair">
        <figure>
          <button class="shot" type="button" data-src="img/opt3-bw.jpg" data-cap="אופציה 3, שחור-לבן" aria-label="הגדלה: אופציה 3, שחור-לבן">
            <span class="frame"><img src="img/opt3-bw.jpg" alt="" decoding="async"></span>
          </button>
          <figcaption>שחור-לבן</figcaption>
        </figure>
        <figure>
          <button class="shot" type="button" data-src="img/opt3-color.jpg" data-cap="אופציה 3, צבע" aria-label="הגדלה: אופציה 3, צבע">
            <span class="frame"><img src="img/opt3-color.jpg" alt="" decoding="async"></span>
          </button>
          <figcaption>צבע</figcaption>
        </figure>
      </div>
      <div class="choose">
        <button class="pick" type="button" aria-pressed="false">
          <span class="off-t">בוחר באופציה הזו</span><span class="on-t" hidden>האופציה שנבחרה</span>
        </button>
      </div>
    </section>

  </main>

  <section class="foot">
    <label class="nl" for="note">הערה</label>
    <textarea id="note" placeholder="משהו שתרצה להוסיף על הבחירה"></textarea>
    <div class="status"><span class="dot"></span><span id="saved">עוד לא נשמר</span></div>
    <p class="close-note">הבחירה וההערה נשמרות אצלך בדפדפן. כשתסיים, עדכן אותנו איזו אופציה בחרת.</p>
  </section>

</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="תצוגה מוגדלת">
  <button class="lb-x" type="button" id="lbx" aria-label="סגירה">&#215;</button>
  <img id="lbimg" src="" alt="">
  <div class="lb-cap" id="lbcap"></div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "yigal-style-choice-v1";
  var opts = Array.prototype.slice.call(document.querySelectorAll(".opt"));
  var note = document.getElementById("note");
  var savedEl = document.getElementById("saved");
  var choice = null;

  /* missing images: keep a quiet frame instead of a broken icon */
  Array.prototype.forEach.call(document.querySelectorAll(".frame img"), function(img){
    img.addEventListener("error", function(){ img.classList.add("gone"); });
    if (img.complete && img.naturalWidth === 0) img.classList.add("gone");
  });

  function stamp(){
    var d = new Date();
    var h = String(d.getHours()).padStart(2,"0");
    var m = String(d.getMinutes()).padStart(2,"0");
    savedEl.textContent = "נשמר " + h + ":" + m;
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({ choice: choice, note: note.value, ts: Date.now() }));
      stamp();
    }catch(e){
      savedEl.textContent = "השמירה בדפדפן חסומה";
    }
  }
  function paint(){
    opts.forEach(function(sec){
      var on = sec.getAttribute("data-opt") === choice;
      var btn = sec.querySelector(".pick");
      sec.classList.toggle("on", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.querySelector(".off-t").hidden = on;
      btn.querySelector(".on-t").hidden = !on;
    });
  }

  opts.forEach(function(sec){
    sec.querySelector(".pick").addEventListener("click", function(){
      var id = sec.getAttribute("data-opt");
      if (choice === id) return;
      choice = id;
      paint(); save();
    });
  });

  var t;
  note.addEventListener("input", function(){ clearTimeout(t); t = setTimeout(save, 400); });
  note.addEventListener("blur", save);

  try{
    var raw = localStorage.getItem(KEY);
    if (raw){
      var d = JSON.parse(raw);
      choice = d.choice || null;
      note.value = d.note || "";
      if (d.ts){
        var dt = new Date(d.ts);
        savedEl.textContent = "נשמר " + String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0");
      }
    }
  }catch(e){}
  paint();

  /* ---------- lightbox ---------- */
  var lb = document.getElementById("lb");
  var lbimg = document.getElementById("lbimg");
  var lbcap = document.getElementById("lbcap");
  var lbx = document.getElementById("lbx");
  var last = null;

  function open(btn){
    var src = btn.getAttribute("data-src");
    lbimg.setAttribute("src", src);
    lbimg.setAttribute("alt", btn.getAttribute("data-cap") || "");
    lbcap.textContent = btn.getAttribute("data-cap") || "";
    lb.classList.add("open");
    document.body.classList.add("locked");
    last = btn;
    lbx.focus();
  }
  function close(){
    lb.classList.remove("open");
    document.body.classList.remove("locked");
    lbimg.setAttribute("src","");
    if (last) last.focus();
    last = null;
  }
  Array.prototype.forEach.call(document.querySelectorAll(".shot"), function(btn){
    btn.addEventListener("click", function(){ open(btn); });
  });
  lb.addEventListener("click", close);
  lbx.addEventListener("click", function(e){ e.stopPropagation(); close(); });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && lb.classList.contains("open")) close();
  });
})();
</script>

</body>
</html>
